name: Publish Docker image

# Builds a multi-arch (amd64 + arm64) image and pushes it to Docker Hub so the
# Raspberry Pi (arm64) can just `docker pull` — no local/emulated build.
#
# RELEASE-TAG DRIVEN: this runs only when you push a git tag like `v1.0.0`
# (not on every commit to main). The published image is tagged with that exact
# version — `navong/rate-scraper:v1.0.0` — so you always know what's deployed.
# `:latest` is also moved to point at the newest release, as a convenience only;
# the compose files PIN a version so the Pi never silently changes under you.
#
# Cut a release:
#   git tag v1.0.0
#   git push origin v1.0.0
# then bump the `image:` tag in docker-compose.pi.yml and `pull && up -d`.
#
# Uses NATIVE runners (ubuntu-24.04 = amd64, ubuntu-24.04-arm = arm64, both free
# for public repos), so the arm64 image builds on real ARM hardware instead of
# slow QEMU emulation. Each arch is pushed by digest, then merged into one tag.
#
# Setup (once): add two repo secrets under
#   Settings → Secrets and variables → Actions → New repository secret
#     DOCKERHUB_USERNAME = navong
#     DOCKERHUB_TOKEN    = <a Docker Hub access token with Read/Write>
#       (create at hub.docker.com → Account settings → Personal access tokens)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (e.g. v1.0.0)"
        required: true

env:
  IMAGE: navong/rate-scraper

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Keep an independent cache for each native architecture. This lets
          # unchanged dependency and build layers survive between releases
          # without AMD64 and ARM64 overwriting one another's cache records.
          cache-from: type=gha,scope=rate-scraper-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=rate-scraper-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The version tag comes from the pushed git tag (e.g. v1.0.0), or the
      # workflow_dispatch input when run manually.
      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }} \
            -t ${{ env.IMAGE }}:latest \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
