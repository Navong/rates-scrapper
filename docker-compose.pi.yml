# Raspberry Pi (arm64) deployment — runs the PRE-BUILT image from Docker Hub.
# No local build: `docker compose -f docker-compose.pi.yml up -d` pulls the
# PINNED version below (multi-arch → the Pi gets the arm64 variant).
#
# Setup on the Pi:
#   1) put this file + a .env in a folder (e.g. ~/rate-scraper/)
#   2) create .env with at least RATES_TOKEN and the ADMIN_* values (see below)
#   3) docker compose -f docker-compose.pi.yml up -d
#   4) curl -s localhost:8787/health
#
# Update to a new release later — one command (see pi-update.sh):
#   ./pi-update.sh v1.0.1     # repin + pull + recreate + prune + health check
#   ./pi-update.sh            # redeploy the currently pinned tag
# (equivalent to: bump the `image:` tag below, then `… pull && … up -d`.)
#
# ONE INSTANCE ONLY: if this Pi is serving, stop the Windows container
# (docker compose down) — two warmers scraping in parallel upsets GME.

services:
  backend:
    # PINNED version — bump this line to deploy a new release (then `pull && up -d`).
    # See the docker-publish workflow: push a git tag `vX.Y.Z` to publish that tag.
    image: navong/rate-scraper:v1.0.0
    pull_policy: always            # re-verify the pinned tag's digest on `up`
    environment:
      - TZ=Asia/Seoul
      - PORT=8787
      - STATE_DIR=/data
      - RATES_TOKEN=${RATES_TOKEN:-}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-gme}
      # Admin (single account). Defaults below are the TEST cred (user "admin",
      # password "admin-test-2026"). Override in .env for production —
      #   npx tsx scripts/hash-password.ts "your-strong-password"
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-362187a34c27f358b24f720ccc501603:20d82f1e9f343b18fd59e45709faf67474747e561b0aa7f106afc3170a862787}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-09ee42f06e25717f9d1f8aaf89490d5ef8dd6fd41250bf5f}
      # Freshness knobs — CACHE_TTL is the warmer's full-cycle time (one corridor
      # every CACHE_TTL/9 s). Lower = fresher, more upstream calls.
      # INVARIANT: keep GME_TTL and PROVIDER_TTL BELOW CACHE_TTL, else the warmer
      # serves stale memo hits instead of re-fetching. GME is the anti-bot limit.
      - CACHE_TTL=${CACHE_TTL:-120}
      - GME_TTL=${GME_TTL:-100}
      - PROVIDER_TTL=${PROVIDER_TTL:-80}
      - MAX_STALE=${MAX_STALE:-900}
      # Shared cache store (see .env.example). Hosted Redis (Upstash): put the
      # rediss://… URL in .env — shared across machines, no local container.
      # Local Redis: `--profile local-redis` + REDIS_URL=redis://redis:6379.
      # Unset: in-memory + rank-cache.json (single instance).
      - REDIS_URL=${REDIS_URL:-}
      # Only the warmer "leader" scrapes; on a viewer-only box set WARMER=off.
      - WARMER=${WARMER:-}
      # Teams webhook for the sheet's "Send to Teams" button (blank = hidden).
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
    # Loopback only — the Pi's cloudflared reaches it on 127.0.0.1:8787.
    # (To hit it from other LAN machines instead, change to "8787:8787".)
    ports:
      - "127.0.0.1:8787:8787"
    # Persist manual rates, fee overrides, the warm rank-cache and analytics.
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Optional self-hosted store — only with `--profile local-redis`.
  # Skip it when REDIS_URL points at a hosted Redis (Upstash). AOF persists.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    profiles: ["local-redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # --- Optional: run the Cloudflare tunnel here too (named tunnel) ---
  # Uncomment and put CF_TUNNEL_TOKEN in .env if you want the Pi to own the
  # tunnel instead of a separate host cloudflared service.
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
  #   depends_on: [backend]
  #   restart: unless-stopped
