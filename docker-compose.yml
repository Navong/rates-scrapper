# Local "home server" production stack: backend + Cloudflare tunnel.
# Runs from YOUR residential IP, so all 5 providers (incl. SBI) work.
#
# Quick tunnel (ephemeral URL, good for testing):
#   docker compose --profile quick up -d --build
#   docker compose logs tunnel-quick        # copy the https://*.trycloudflare.com URL
#
# Named tunnel (STABLE URL via your Cloudflare domain — production):
#   1) Put CF_TUNNEL_TOKEN in .env  (see NEXT-STEPS.md)
#   2) docker compose --profile named up -d --build
#
#   docker compose down                      # stop everything

services:
  backend:
    build: .
    image: rate-backend
    environment:
      - TZ=Asia/Seoul
      - PORT=8787
      - RATES_TOKEN=${RATES_TOKEN:-}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-gme}
      # Admin (single account). Defaults below are a TEST cred (user "admin",
      # password "admin-test-2026") — regenerate with:
      #   npx tsx scripts/hash-password.ts "your-strong-password"
      # and put ADMIN_USER / ADMIN_PASSWORD_HASH / ADMIN_TOKEN in .env.
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-362187a34c27f358b24f720ccc501603:20d82f1e9f343b18fd59e45709faf67474747e561b0aa7f106afc3170a862787}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-09ee42f06e25717f9d1f8aaf89490d5ef8dd6fd41250bf5f}
      # Freshness knobs. CACHE_TTL is the warmer's full-cycle time: with 9
      # corridors it refreshes one every CACHE_TTL/9 s, so each corridor is at
      # most ~CACHE_TTL old. Lower = fresher but more upstream calls.
      # INVARIANT: GME_TTL and PROVIDER_TTL must stay BELOW CACHE_TTL, or the
      # warmer (which respects the memo) serves stale memo hits instead of
      # re-fetching. GME is the anti-bot bottleneck — keep its gap/backoff.
      - CACHE_TTL=${CACHE_TTL:-120}
      - GME_TTL=${GME_TTL:-100}
      - PROVIDER_TTL=${PROVIDER_TTL:-80}
      - MAX_STALE=${MAX_STALE:-900}
      - STATE_DIR=/data
      # Shared cache store (see .env.example). Three modes:
      #   • hosted (Upstash, etc.): put the rediss://… URL in .env → shared across
      #     machines, nothing to run locally.
      #   • local Redis: `docker compose --profile local-redis up -d` and set
      #     REDIS_URL=redis://redis:6379 in .env.
      #   • unset: in-memory + rank-cache.json file, single instance.
      # Only the warmer "leader" scrapes; set WARMER=off on any extra viewer.
      - REDIS_URL=${REDIS_URL:-}
      - WARMER=${WARMER:-}
      # Teams Incoming Webhook / Workflow URL for the sheet's "Send to Teams"
      # button (blank = button hidden). Create it on the channel, then set in .env.
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
    # Publish on BOTH loopback families so the host cloudflared service reaches it
    # whether it resolves localhost to 127.0.0.1 (IPv4) or ::1 (IPv6).
    # Loopback-only — not exposed to the LAN.
    ports:
      - "127.0.0.1:8787:8787"
      - "[::1]:8787:8787"
    # Bind-mount the project's ./data so manual rates, fee overrides, the warm
    # rank-cache and analytics all persist on the host (and carry over from the
    # host-run setup) — visible and editable outside the container.
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Optional self-hosted store — only starts with `--profile local-redis`.
  # (Skip it entirely when REDIS_URL points at a hosted Redis like Upstash.)
  # AOF on so it survives a restart.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    profiles: ["local-redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5

  # NOTE: cloudflared runs as a HOST service (not here) because the Cloudflare
  # tunnel routes several other sites (minio/baserow/wordpress/…) to host
  # localhost ports. The host service can reach all of them; a container can't.
  # The backend publishes 8787 on both 127.0.0.1 and ::1 (dual-stack) so the
  # host cloudflared reaches it regardless of localhost→IPv4/IPv6 resolution.

  # --- Optional: quick tunnel for ad-hoc testing (random URL) ---
  tunnel-quick:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://backend:8787
    depends_on: [backend]
    restart: unless-stopped
    profiles: ["quick"]
